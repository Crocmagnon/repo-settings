name: Check drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 test_sync.py
      - run: python3 sync.py --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.SETTINGS_TOKEN }}
